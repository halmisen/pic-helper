<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
<title>18 周苍柏公馆</title><desc>武汉建筑散步提词卡。上半部为官方参考图的一次图生图重绘，下半部为确定性 SVG 信息。</desc>
<rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
<text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="180" font-weight="700">18</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="116" font-weight="700">周苍柏公馆</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="48">约1920年　黄陂村5、6、7号</text>
<image href="18-周苍柏公馆-上半部-图生图.png" x="160" y="620" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/>
<line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/><text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="76" font-weight="700">一组小楼，如何留住公共记忆</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="42">先看红瓦和小洋楼尺度，再讲住宅如何承载城市事件。</text>
<line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
<g fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">约1920年建成的二层西式</tspan><tspan x="190" dy="82">住宅，红瓦斜坡屋顶、清水</tspan><tspan x="190" dy="82">青砖、拱券门和二层露台，</tspan><tspan x="190" dy="82">构成清晰的识别特征。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">位于江岸区黄陂村5、6、7号。</tspan><tspan x="1330" dy="82">其中6、7号与周苍柏有关，</tspan><tspan x="1330" dy="82">5号是同一时期建筑，但不是</tspan><tspan x="1330" dy="82">周苍柏故居。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">周苍柏1920年起住在6号，</tspan><tspan x="190" dy="82">1926年买下7号。抗战初期，</tspan><tspan x="190" dy="82">武汉合唱团曾在周公馆排练。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">建筑列入武汉市优秀历史建筑，</tspan><tspan x="1330" dy="82">今天仍保留住宅使用。现场</tspan><tspan x="1330" dy="82">可以观察名人故居的普通住宅</tspan><tspan x="1330" dy="82">尺度。</tspan></text></g>
<line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="916" cy="5140" r="14"/><circle cx="1603" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="34"><text x="175" y="5240">1920　居住</text><text x="850" y="5240">1926　购7号</text><text x="1510" y="5240">抗战初期　排练</text><text x="2180" y="5240">今天　市保</text></g>
</svg>
