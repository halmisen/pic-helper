<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>5 德租界工部局巡捕房旧址</title><desc>武汉建筑散步提词卡。上半部为真实建筑参考图的一次图生图重绘，下半部为 SVG 讲解信息。</desc>
  <rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">5</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="112" font-weight="700">德租界工部局巡捕房旧址</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">胜利街 271 号 · 现武汉警察博物馆</text>
  <image href="5-德租界工部局巡捕房旧址-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/><line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一座钟楼，曾经管理什么</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">先看塔楼和拱券，再讲租界的行政、警察与公共记忆。</text>
  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">红砖墙、圆拱窗、拱廊和转角</tspan><tspan x="190" dy="82">钟楼是识别重点。高塔让原本的</tspan><tspan x="190" dy="82">行政建筑拥有了城市标志性。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">这是原德租界工部局巡捕房，</tspan><tspan x="1330" dy="82">位于胜利街 271 号。工部局与</tspan><tspan x="1330" dy="82">巡捕房曾共享同一栋建筑。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">1906 年德租界设立工部局，</tspan><tspan x="190" dy="82">1917 年相关区域被接管；1993</tspan><tspan x="190" dy="82">年列为优秀历史建筑，2017 年修缮。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">2019 年武汉警察博物馆开馆。</tspan><tspan x="1330" dy="82">建成年代有 1895、1909 两种</tspan><tspan x="1330" dy="82">记载，现场不把年份讲死。</tspan></text></g>
  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="642" cy="5140" r="14"/><circle cx="1054" cy="5140" r="14"/><circle cx="1466" cy="5140" r="14"/><circle cx="1878" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34"><text x="170" y="5240">1906　设工部局</text><text x="580" y="5240">1917　接管</text><text x="985" y="5240">1993　列入保护</text><text x="1390" y="5240">2017　修缮</text><text x="1790" y="5240">2019　博物馆开馆</text><text x="2190" y="5240">今天　公共文化</text></g>
</svg>
