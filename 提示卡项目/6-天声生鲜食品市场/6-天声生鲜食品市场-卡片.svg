<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>6 天声生鲜食品市场</title><desc>武汉建筑散步提词卡。上半部为真实街市参考图的一次图生图重绘，下半部为 SVG 讲解信息。</desc>
  <rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">6</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="124" font-weight="700">天声生鲜食品市场</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">1911 起　江岸区天声街 · 大智门火车站附近</text>
  <image href="6-天声生鲜食品市场-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/><line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一条街，如何长成一座菜场</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">先看街道尺度，再把火车站、舞台和早市放回同一条线。</text>
  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">它不是一栋孤立建筑，而是连续</tspan><tspan x="190" dy="82">低层街屋、雨棚、摊位和巷道</tspan><tspan x="190" dy="82">共同组成的近代街市界面。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">天声街长约 246 米，紧邻大智门</tspan><tspan x="1330" dy="82">火车站。生鲜、干货、小吃和</tspan><tspan x="1330" dy="82">早餐把它变成老汉口的菜场。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">1911 年始建，最初称铁路街；</tspan><tspan x="190" dy="82">1920 年天声舞台开演，1943 年</tspan><tspan x="190" dy="82">资料记载改名，1992 年车站搬迁。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">今天的重点不是“看一栋老房子”，</tspan><tspan x="1330" dy="82">而是看买菜、过早和送货如何</tspan><tspan x="1330" dy="82">持续塑造一条老街。</tspan></text></g>
  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="642" cy="5140" r="14"/><circle cx="1054" cy="5140" r="14"/><circle cx="1466" cy="5140" r="14"/><circle cx="1878" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34"><text x="170" y="5240">1911　铁路街</text><text x="580" y="5240">1920　天声舞台</text><text x="985" y="5240">1943　改名记载</text><text x="1390" y="5240">1992　车站搬迁</text><text x="1790" y="5240">2023　171 家门店</text><text x="2190" y="5240">今天　早市日常</text></g>
</svg>
