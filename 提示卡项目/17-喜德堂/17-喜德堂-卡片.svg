<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>17 喜德堂</title><desc>武汉建筑散步提词卡。上半部为现状建筑入口参考图的一次图生图重绘，下半部为 SVG 讲解信息。</desc>
  <rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">17</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="138" font-weight="700">喜德堂</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">黎黄陂路 42 号 · 老建筑中的新酒馆</text>
  <image href="17-喜德堂-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/><line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一扇老门，如何换一种生活</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">先看红砖和柱廊，再讲老街如何容纳新的公共生活。</text>
  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">红砖、深进门廊、成对柱子和</tspan><tspan x="190" dy="82">上部檐口是入口的识别重点。</tspan><tspan x="190" dy="82">先讲空间，不急着补历史身份。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">喜德堂是黎黄陂路 42 号的一家</tspan><tspan x="1330" dy="82">酒馆。文旅报道确认它开在老</tspan><tspan x="1330" dy="82">建筑中，并记录了入口与二层。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">1900 年黎黄陂路由租界当局</tspan><tspan x="190" dy="82">修建，1946 年定名。2023 年</tspan><tspan x="190" dy="82">老建筑中出现了喜德堂的新业态。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">现有资料不能确认原建筑年代</tspan><tspan x="1330" dy="82">或前身机构。今天以现场入口、</tspan><tspan x="1330" dy="82">老街界面和新使用方式为观察点。</tspan></text></g>
  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="916" cy="5140" r="14"/><circle cx="1603" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34"><text x="180" y="5240">1900　道路修建</text><text x="850" y="5240">1946　定名</text><text x="1510" y="5240">2023　酒馆报道</text><text x="2200" y="5240">今天　新业态</text></g>
</svg>
