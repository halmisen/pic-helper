<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
<title>10 法租界消防队旧址</title><desc>武汉建筑散步提词卡。上半部为官方参考图的一次图生图重绘，下半部为确定性 SVG 信息。</desc>
<rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
<text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="180" font-weight="700">10</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="116" font-weight="700">法租界消防队旧址</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="48">1914年　岳飞街19号</text>
<image href="10-法租界消防队旧址-上半部-图生图.png" x="160" y="620" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/>
<line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/><text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="76" font-weight="700">一栋消防房，如何守住城市</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="42">先看街道位置，再讲租界时代的公共安全协作。</text>
<line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
<g fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">这是一座服务性建筑，约形成</tspan><tspan x="190" dy="82">于1914年。观察门窗、砖墙和</tspan><tspan x="190" dy="82">街道位置，可以读出它的功能</tspan><tspan x="190" dy="82">尺度，而非纪念性体量。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">它位于岳飞街19号，原为</tspan><tspan x="1330" dy="82">汉口法租界巡捕房消防队，</tspan><tspan x="1330" dy="82">今天仍处在居民街区的城市</tspan><tspan x="1330" dy="82">日常之中。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">1914年消防队成立。20世纪</tspan><tspan x="190" dy="82">二三十年代，英、德、俄租界</tspan><tspan x="190" dy="82">消防队相互支援；1928年底</tspan><tspan x="190" dy="82">服务范围名义上扩大到全市。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">它作为武汉优秀历史建筑被</tspan><tspan x="1330" dy="82">保留下来。现场可以讲：城市</tspan><tspan x="1330" dy="82">公共安全的制度，也曾藏在</tspan><tspan x="1330" dy="82">这样的街道建筑里。</tspan></text></g>
<line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC,serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="916" cy="5140" r="14"/><circle cx="1603" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC,sans-serif" font-size="34"><text x="175" y="5240">1914　成立</text><text x="830" y="5240">1920s—30s　发展</text><text x="1490" y="5240">1928　扩展</text><text x="2180" y="5240">今天　保留</text></g>
</svg>
