<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>12 汉口圣母无原罪堂</title>
  <desc>武汉建筑散步提词卡。上半部为 Wikimedia 真实参考图的唯一一次图生图重绘，下半部为讲解信息。</desc>
  <rect width="2520" height="5472" fill="#FCFBF7"/>
  <g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">12</text>
  <text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="116" font-weight="700">汉口圣母无原罪堂</text>
  <text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">1910　车站路25号 · 汉口法租界</text>
  <image href="12-汉口圣母无原罪堂-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/>
  <line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一座小教堂，如何留住法租界的城市记忆</text>
  <text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">从山墙、玫瑰窗和尖拱门，看一座宗教空间的多次转身。</text>
  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/>
  <g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50">
    <text x="190" y="3480"><tspan x="190" dy="0">1910年建成的小型天主教堂，</tspan><tspan x="190" dy="82">平面呈拉丁十字形，内部为</tspan><tspan x="190" dy="82">哥特式。山墙、玫瑰窗、侧圆</tspan><tspan x="190" dy="82">窗和尖拱入口形成正立面轴线。</tspan></text>
    <text x="1330" y="3480"><tspan x="1330" dy="0">它又名汉口“法国堂”，位于</tspan><tspan x="1330" dy="82">车站路25号，原在汉口法租界</tspan><tspan x="1330" dy="82">的大法总理街。堂区2000余</tspan><tspan x="1330" dy="82">平方米，教堂本体300余平方米。</tspan></text>
    <text x="190" y="4370"><tspan x="190" dy="0">1910年开始建堂；1924—1925</tspan><tspan x="190" dy="82">年增建账房。1953年发生车站</tspan><tspan x="190" dy="82">路教堂事件，后来建筑改作他用。</tspan></text>
    <text x="1330" y="4370"><tspan x="1330" dy="0">1997年曾改作酒吧，2010年</tspan><tspan x="1330" dy="82">停业；2014年8月8日重新作为</tspan><tspan x="1330" dy="82">教堂开放。现场不推断具体开放</tspan><tspan x="1330" dy="82">时段，以建筑身份变化为重点。</tspan></text>
  </g>
  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/>
  <text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text>
  <line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/>
  <g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="745" cy="5140" r="14"/><circle cx="1260" cy="5140" r="14"/><circle cx="1775" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34"><text x="185" y="5240">1910　建堂</text><text x="670" y="5240">1924—25　账房</text><text x="1195" y="5240">1953　教堂事件</text><text x="1710" y="5240">1997　酒吧</text><text x="2210" y="5240">2014　重开</text></g>
</svg>
