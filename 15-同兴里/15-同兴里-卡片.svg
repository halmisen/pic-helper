<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>15 同兴里</title><desc>武汉建筑散步提词卡。上半部为真实里分参考图的一次图生图重绘，下半部为 SVG 讲解信息。</desc>
  <rect width="2520" height="5472" fill="#FCFBF7"/><g fill="#0B4FAF" stroke="#0B4FAF"><line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/><circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/><circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/></g>
  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">15</text><text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="138" font-weight="700">同兴里</text><text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">1932　汉口近代里分 · 石库门住宅群</text>
  <image href="15-同兴里-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/><line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一条巷子，如何容纳共同生活</text><text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">先看门、巷、天井，再看居住和新业态怎样叠在一起。</text>
  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/><line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/><g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700"><text x="190" y="3350">建筑风格</text><text x="1330" y="3350">它是什么地方</text><text x="190" y="4240">它经历了什么</text><text x="1330" y="4240">现状</text></g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50"><text x="190" y="3480"><tspan x="190" dy="0">石库门门框、两层砖混小楼和</tspan><tspan x="190" dy="82">狭窄巷道重复出现。重点不是</tspan><tspan x="190" dy="82">单栋造型，而是连续的生活界面。</tspan></text><text x="1330" y="3480"><tspan x="1330" dy="0">同兴里是 1932 年形成的里分</tspan><tspan x="1330" dy="82">住宅群，共 25 栋两层小楼，</tspan><tspan x="1330" dy="82">巷道两侧还保留天井结构。</tspan></text><text x="190" y="4370"><tspan x="190" dy="0">它经历了里分住宅的兴盛期，</tspan><tspan x="190" dy="82">1993 年被公布为二级优秀历史</tspan><tspan x="190" dy="82">建筑，之后继续面对更新与使用。</tspan></text><text x="1330" y="4370"><tspan x="1330" dy="0">居民生活与咖啡、餐饮、创意店</tspan><tspan x="1330" dy="82">和民宿并存。现场可从门牌、</tspan><tspan x="1330" dy="82">植物和小店看见时间叠层。</tspan></text></g>
  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/><text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text><line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/><g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5"><circle cx="230" cy="5140" r="14"/><circle cx="745" cy="5140" r="14"/><circle cx="1260" cy="5140" r="14"/><circle cx="1775" cy="5140" r="14"/><circle cx="2290" cy="5140" r="14"/></g><g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34"><text x="180" y="5240">1932　建成</text><text x="690" y="5240">1993　列入保护</text><text x="1190" y="5240">2018　保护讨论</text><text x="1660" y="5240">近年　新用途进入</text><text x="2200" y="5240">今天　生活并存</text></g>
</svg>
