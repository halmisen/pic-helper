<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="5472" viewBox="0 0 2520 5472">
  <title>33 金城银行大楼</title>
  <desc>武汉建筑散步提词卡。上半部为真实建筑参考图的唯一一次图生图重绘，下半部为 SVG 讲解信息。</desc>

  <rect width="2520" height="5472" fill="#FCFBF7"/>
  <g fill="#0B4FAF" stroke="#0B4FAF">
    <line x1="160" y1="150" x2="2360" y2="150" stroke-width="5"/>
    <circle cx="160" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/>
    <circle cx="2360" cy="150" r="11" fill="#FCFBF7" stroke-width="5"/>
  </g>

  <text x="180" y="360" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="180" font-weight="700">33</text>
  <text x="620" y="350" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="126" font-weight="700">金城银行大楼</text>
  <text x="625" y="485" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="48">1931　保华街2号 · 今天的武汉美术馆</text>

  <image href="33-金城银行大楼-上半部-图生图.png" x="160" y="600" width="2200" height="2040" preserveAspectRatio="xMidYMid meet"/>

  <line x1="160" y1="2860" x2="2360" y2="2860" stroke="#0B4FAF" stroke-width="5"/>
  <text x="180" y="3005" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="76" font-weight="700">一座银行，如何留下公共生活</text>
  <text x="182" y="3100" fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="42">先看柱廊和台阶，再讲建筑怎样从金融机构变成文化空间。</text>

  <line x1="1260" y1="3210" x2="1260" y2="4780" stroke="#0B4FAF" stroke-width="4"/>
  <line x1="160" y1="4100" x2="2360" y2="4100" stroke="#0B4FAF" stroke-width="4"/>

  <g fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="66" font-weight="700">
    <text x="190" y="3350">建筑风格</text>
    <text x="1330" y="3350">它是什么地方</text>
    <text x="190" y="4240">它经历了什么</text>
    <text x="1330" y="4240">现状</text>
  </g>

  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="50">
    <text x="190" y="3480">
      <tspan x="190" dy="0">1931年建成的四层建筑，</tspan>
      <tspan x="190" dy="82">以古典复兴为基础，又把</tspan>
      <tspan x="190" dy="82">柱头、山花和入口细节做了</tspan>
      <tspan x="190" dy="82">中国化处理。最醒目的是</tspan>
      <tspan x="190" dy="82">贯通多层的中央柱廊。</tspan>
    </text>

    <text x="1330" y="3480">
      <tspan x="1330" dy="0">它是金城银行汉口分行旧址，</tspan>
      <tspan x="1330" dy="82">位于保华街2号，今天是</tspan>
      <tspan x="1330" dy="82">武汉美术馆所在地。背后的</tspan>
      <tspan x="1330" dy="82">金城里住宅，与银行大楼</tspan>
      <tspan x="1330" dy="82">共同组成建筑群。</tspan>
    </text>

    <text x="190" y="4370">
      <tspan x="190" dy="0">1930年动工，1931年落成。</tspan>
      <tspan x="190" dy="82">1938年武汉沦陷后，建筑曾</tspan>
      <tspan x="190" dy="82">被日军占用；1945年抗战</tspan>
      <tspan x="190" dy="82">胜利后，才回到金城银行手中。</tspan>
    </text>

    <text x="1330" y="4370">
      <tspan x="1330" dy="0">今天可以把它讲成“银行建筑</tspan>
      <tspan x="1330" dy="82">如何被重新使用”：原来的</tspan>
      <tspan x="1330" dy="82">金融机构退出了，建筑的</tspan>
      <tspan x="1330" dy="82">公共文化功能留下来。</tspan>
    </text>
  </g>

  <line x1="160" y1="4850" x2="2360" y2="4850" stroke="#0B4FAF" stroke-width="4"/>
  <text x="190" y="4960" fill="#0B4FAF" font-family="Noto Serif CJK SC, serif" font-size="72" font-weight="700">时间轴</text>
  <line x1="230" y1="5140" x2="2290" y2="5140" stroke="#0B4FAF" stroke-width="5"/>
  <g fill="#FCFBF7" stroke="#0B4FAF" stroke-width="5">
    <circle cx="230" cy="5140" r="14"/>
    <circle cx="642" cy="5140" r="14"/>
    <circle cx="1054" cy="5140" r="14"/>
    <circle cx="1466" cy="5140" r="14"/>
    <circle cx="1878" cy="5140" r="14"/>
    <circle cx="2290" cy="5140" r="14"/>
  </g>
  <g fill="#0B4FAF" font-family="Noto Sans CJK SC, sans-serif" font-size="34">
    <text x="185" y="5240">1930　动工</text>
    <text x="590" y="5240">1931　建成</text>
    <text x="985" y="5240">1938　被占用</text>
    <text x="1365" y="5240">1945　归还</text>
    <text x="1770" y="5240">1952　图书馆</text>
    <text x="2130" y="5240">2003　筹建美术馆</text>
  </g>
</svg>
